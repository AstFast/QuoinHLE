[package]
name = "quoin-web"
version = "0.0.1-beta"
edition = "2021"
publish = false
# A literal because this crate is excluded from the root workspace (Trunk builds it
# with its own lock file), so it cannot inherit `[workspace.package]`.
license = "GPL-2.0-or-later"

[lib]
name = "quoin_web"
path = "entry.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The core's default feature (`script`) pulls in `mlua`/`rfd` on desktop and is replaced by
# `script_stub.rs` on wasm32. Spell the dependency out instead of relying on that target
# gate: a future move of `mlua` into the unconditional dependency list would otherwise
# break this bundle without touching a file in it. `index.html` passes
# `data-cargo-no-default-features` to Trunk for the same reason.
quoin = { path = "../..", default-features = false }
eframe = { version = "0.31", default-features = false, features = ["glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Navigator"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
