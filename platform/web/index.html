<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuoinHLE</title>
    <!-- Trunk rewrites this to the deployed public URL, so the injected wasm path and the
         relative `./quoin_web.js` import below agree when the page is hosted under a
         sub-path instead of at `/`. -->
    <base data-trunk-public-url />
    <!-- Inlined on purpose: the committed app-icon.svg is ~1.5 MB and lives outside
         platform/web/, which a `copy-file` link would have to reach with `..`. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b2b2b'/%3E%3Cpath d='M9 9h14v14H9z' fill='none' stroke='%235bc8a4' stroke-width='3'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
      }
      #quoin {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #b8b8b8;
        font: 14px system-ui, sans-serif;
        pointer-events: none;
      }
      #loading.error {
        color: #e88;
        pointer-events: auto;
        white-space: pre-wrap;
        padding: 2rem;
        text-align: center;
      }
      #notice {
        position: fixed;
        left: 50%;
        bottom: 1rem;
        transform: translateX(-50%);
        max-width: 46rem;
        padding: 0.6rem 1rem;
        border: 1px solid #555;
        border-radius: 0.5rem;
        background: #2b2b2b;
        color: #e8c07a;
        font: 12px/1.5 system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #notice[hidden] {
        display: none;
      }
    </style>
    <!-- No `script` feature: on wasm it is a stub anyway, and being explicit keeps the
         desktop-only mlua/rfd dependencies out of this workspace's dependency graph. -->
    <link data-trunk rel="rust" data-cargo-no-default-features />
  </head>
  <body>
    <div id="loading">quoin — loading…</div>
    <div id="notice" hidden>
      Web build: no packs in the library yet — the browser has no file-system backend for
      <code>Game/</code>, so <code>library::scan</code> finds nothing. Use the desktop build to
      play a pack. The browser build cannot read a local <code>Game/</code> directory; use the desktop build to run packs.
    </div>
    <canvas id="quoin" tabindex="0"></canvas>
    <script type="module">
      const loading = document.getElementById("loading");
      let handle = null;

      // A runner that was replaced (hot reload, a second start, a failed restart) must be
      // torn down first: WebRunner installs listeners, a ResizeObserver, a text agent and
      // a requestAnimationFrame loop, none of which the page can reach afterwards.
      const dispose = () => {
        const old = window.__quoin || handle;
        window.__quoin = null;
        handle = null;
        if (old && typeof old.destroy === "function") {
          try {
            old.destroy();
          } catch (error) {
            console.warn("quoin: runner destroy failed", error);
          }
        }
      };
      window.addEventListener("pagehide", dispose);

      const fail = (error) => {
        console.error(error);
        loading.className = "error";
        loading.textContent = `quoin could not start: ${error}`;
      };

      try {
        // Dynamic import only: a top-level static import is evaluated during module
        // linking, before any statement in this block, so a 404 or a missing export
        // would skip this try/catch and leave the page stuck on "loading…" forever.
        const { default: init, WebHandle } = await import("./quoin_web.js");
        if (typeof init !== "function" || typeof WebHandle !== "function") {
          throw new Error("./quoin_web.js does not export init and WebHandle");
        }
        await init();
        dispose();
        handle = new WebHandle();
        await handle.start(document.getElementById("quoin"));
        window.__quoin = handle;
        loading.remove();
        // An empty library is a known browser limitation, not a broken page. Say so
        // instead of leaving the manager's blank list to be read as a failed start.
        if (typeof handle.pack_count === "function" && handle.pack_count() === 0) {
          document.getElementById("notice").hidden = false;
        }
      } catch (error) {
        // A half-initialised handle still owns a WebRunner; let it clean up.
        dispose();
        fail(error);
      }
    </script>
  </body>
</html>
